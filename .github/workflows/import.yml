# Statewide import, run entirely on GitHub's runners.
#
# The point of doing it here rather than on a laptop: a full run streams ~5.7 GB
# of booth PDFs and produces ~2.5 GB of intermediate rows. On a runner that is
# disposable scratch space; the only thing that comes back is docs/data.
#
# Districts run as a matrix, so wall-clock is one district (~20-50 min) rather
# than the ~9 hours a single sequential pass takes.

name: Import ASDDO data

on:
  workflow_dispatch:
    inputs:
      districts:
        description: 'Force-pull these districts even if unchanged (comma-separated), or "all" for pure incremental'
        default: 'all'
        type: string
      full_refresh:
        description: 'Re-pull every district from source, ignoring the cache (use after a parser change)'
        default: false
        type: boolean
      concurrency_per_job:
        description: 'Parallel Drive fetches per runner'
        default: '6'
        type: string
      allow_partial:
        description: 'Publish even if some districts failed (normally refused)'
        default: false
        type: boolean
  # Source PDFs are regenerated daily; weekly keeps the site honest without
  # hammering Drive. Delete this block to make imports manual only.
  schedule:
    - cron: '20 2 * * 0'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      districts: ${{ steps.plan.outputs.districts }}
      source_districts: ${{ steps.plan.outputs.source_districts }}
      empty: ${{ steps.plan.outputs.empty }}
      # Incremental plan: the matrix of only the districts that must be pulled
      # this run (changed at source, or missing from the restored cache).
      extract_matrix: ${{ steps.incr.outputs.matrix }}
      extract_districts: ${{ steps.incr.outputs.districts }}
      mode: ${{ steps.incr.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # One district ships its booth lists as a .rar inside a .zip, which zlib
      # cannot read. unar handles RAR5 and is a single apt package; without it
      # those 250 booths are reported unreadable rather than silently lost.
      - name: Install a RAR extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar

      # Both sources are third-party and neither is under our control. When a
      # run fails, the first question is always "could the runner even reach
      # them", and answering it in the log costs three seconds.
      - name: Preflight — can this runner reach the sources?
        # A diagnostic must never be the thing that fails the job. Both guards
        # are deliberate: `set +e` so a dead host does not trip bash -e, and
        # continue-on-error so this step reports and gets out of the way.
        continue-on-error: true
        run: |
          set +e
          echo "runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          for url in \
            "https://ceo.karnataka.gov.in/asddo.html" \
            "https://drive.google.com/embeddedfolderview?id=1ozZpVkJQvBItLlh5BbT9Z0EuOgPszBmA#list" \
            "https://ceo.karnataka.gov.in/csv_upload/english/A001.csv"; do
            rm -f /tmp/pf.out
            code=$(curl -s -o /tmp/pf.out -w '%{http_code}' --max-time 20 \
                   -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0 Safari/537.36" "$url")
            [ -z "$code" ] && code="000(no response)"
            size=0; [ -f /tmp/pf.out ] && size=$(wc -c < /tmp/pf.out)
            echo "  ${code}  ${url}  (${size} bytes)"
            if [ "$code" != "200" ] && [ -s /tmp/pf.out ]; then
              echo "  --- first 300 bytes ---"
              head -c 300 /tmp/pf.out
              echo
            fi
          done
          exit 0

      # ceo.karnataka.gov.in is reachable from an Indian consumer connection but
      # not necessarily from a GitHub runner — some government hosts refuse
      # datacenter and foreign IP ranges. Drive is what the heavy `extract` job
      # actually needs; the CEO site is only needed here, to learn which booth
      # PDFs exist. So if the crawl is refused, fall back to the manifest
      # committed in seed/ rather than losing the whole import.
      # Always crawl the FULL source: discovery only lists which booth PDFs exist
      # (cheap), and the incremental plan below needs the complete picture to
      # decide what changed and to keep the built manifest's district metadata
      # correct. The expensive, throttling-prone part is the per-PDF extract, and
      # that is what the plan narrows to only the changed districts.
      - name: Crawl source page and Drive folders
        id: crawl
        continue-on-error: true
        run: node scripts/1-discover.mjs

      - name: Fall back to the committed manifest
        if: steps.crawl.outcome == 'failure'
        run: |
          if [ ! -f seed/manifest.json.gz ]; then
            echo "::error::Crawl failed and no seed/manifest.json.gz to fall back to."
            exit 1
          fi
          mkdir -p cache
          gunzip -c seed/manifest.json.gz > cache/manifest.json
          SEEDED=$(node -e 'console.log(require("./cache/manifest.json").discoveredAt)')
          echo "::warning::Crawl failed; using the seed manifest discovered at ${SEEDED}. Booths added or removed at the source since then are not in this run. Refresh it with: node scripts/1-discover.mjs && gzip -9c cache/manifest.json > seed/manifest.json.gz"

      # This step is where two districts were lost without a trace. It filters
      # out districts that yielded no booth PDFs, and every later check compared
      # against *this* number -- so an import that had already dropped
      # Vijayanagara and Bangalore Rural still reported "all districts imported".
      # The filter is still needed to build a matrix; what changes is that
      # dropping anything is now a failure rather than a silent narrowing.
      - name: Plan the district matrix
        id: plan
        env:
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: node scripts/plan-matrix.mjs

      # Restore the rows pulled by previous runs so the plan below can pull ONLY
      # the districts whose source changed (or that the cache is missing), instead
      # of re-downloading every booth from Drive. A cold cache => every district
      # is "missing" => a full pull, so a first run or an evicted cache is safe.
      - name: Restore extracted-rows cache
        uses: actions/cache/restore@v4
        with:
          path: cache/extracted
          key: extracted-${{ github.run_id }}
          restore-keys: extracted-

      - name: Decide which districts to pull this run
        id: incr
        env:
          FORCE_FULL: ${{ inputs.full_refresh }}
          FORCE_DISTRICTS: ${{ inputs.districts }}
        run: node scripts/plan-incremental.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: cache/manifest.json
          retention-days: 1

  extract:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Every runner fetches from the same Drive endpoints. 6 runners x 6
      # sockets is already 36 parallel requests at the source; raising this
      # trades throughput for throttling and 403s.
      max-parallel: 6
      # Only the districts the incremental plan selected — unchanged, already
      # cached districts are not re-pulled. Empty include => this job is skipped.
      matrix: ${{ fromJson(needs.discover.outputs.extract_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # One district ships its booth lists as a .rar inside a .zip, which zlib
      # cannot read. unar handles RAR5 and is a single apt package; without it
      # those 250 booths are reported unreadable rather than silently lost.
      - name: Install a RAR extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar

      - uses: actions/download-artifact@v4
        with: { name: manifest, path: cache }

      # Retry until no booth is left failing, so a transient Drive 403/timeout
      # cannot silently drop a booth (and its voters). A re-run skips completed
      # booths via the .done ledger and only re-fetches failures, so this is cheap
      # even for a fully-successful district. Any booth still failing after the
      # retries is surfaced loudly and stays out of .done, so a later run retries
      # it rather than the gap being baked in.
      - name: Stream and parse ${{ matrix.name }} (${{ matrix.booths }} booths)
        run: |
          failed() { node -e 'try{process.stdout.write(String(require("./cache/extract-report.json").failed||0))}catch{process.stdout.write("0")}'; }
          for attempt in 1 2 3 4; do
            node scripts/2-extract.mjs --district "${{ matrix.name }}" --concurrency ${{ inputs.concurrency_per_job || '6' }}
            F=$(failed)
            echo "attempt ${attempt}: ${F} booth(s) still failing"
            [ "$F" = "0" ] && break
            sleep 20
          done
          F=$(failed)
          if [ "$F" != "0" ]; then
            echo "::warning::${{ matrix.name }}: ${F} booth(s) still failed after 4 attempts. Their rows are NOT cached, so a later run will retry them; do not treat this district as complete."
          fi

      - name: Rows extracted
        run: wc -l cache/extracted/${{ matrix.slug }}.ndjson || true

      - uses: actions/upload-artifact@v4
        with:
          name: rows-${{ matrix.slug }}
          path: |
            cache/extracted/${{ matrix.slug }}.ndjson
            cache/extracted/${{ matrix.slug }}.done
          retention-days: 3

  build:
    needs: [discover, extract]
    # Runs even when some districts failed, so one 403 does not throw away a
    # two-hour matrix -- but NOT when the run was cancelled. A cancelled matrix
    # has arbitrarily few artifacts, and publishing those silently replaced 19
    # districts of live data with 2. Partial output is refused below unless
    # asked for explicitly.
    if: always() && needs.discover.result == 'success' && needs.extract.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Restore every district's rows from previous runs first; the freshly
      # pulled ones below overwrite only the districts that changed. Together they
      # give the build a complete set without re-downloading unchanged districts.
      - name: Restore extracted-rows cache
        uses: actions/cache/restore@v4
        with:
          path: cache/extracted
          key: extracted-${{ github.run_id }}
          restore-keys: extracted-

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rows-*
          merge-multiple: true
          path: cache/extracted

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: manifest, path: cache }

      # `if: always()` keeps this job alive so a partial matrix still publishes.
      # The cost is that it also runs when extract never started, and an empty
      # download there must read as "upstream failed", not as a build error.
      # With incremental pulls, "did we produce rows" can no longer be answered by
      # counting this run's artifacts — most districts come from the restored
      # cache. Instead require that EVERY district on the source page has a
      # non-empty rows file in cache/extracted (cache-reused or freshly pulled).
      # A district missing here would be silently dropped from the site, so refuse
      # unless allow_partial. A cold cache lands every district in the extract
      # matrix, so this passes on a full run too.
      - name: Refuse to publish a partial import
        env:
          MODE: ${{ needs.discover.outputs.mode }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("cache/manifest.json", "utf8"));
            const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            const missing = [];
            for (const d of m.districts) {
              const p = `cache/extracted/${slug(d.name)}.ndjson`;
              let size = 0; try { size = fs.statSync(p).size; } catch {}
              if (!size) missing.push(d.name);
            }
            const have = m.districts.length - missing.length;
            console.log(`districts with rows: ${have}/${m.districts.length} (mode=${process.env.MODE})`);
            if (missing.length) {
              if (process.env.ALLOW_PARTIAL === "true") {
                console.log(`::warning::Publishing without these districts (allow_partial=true): ${missing.join(", ")}`);
              } else {
                console.error(`::error::These source districts have no rows (cache miss and not extracted this run): ${missing.join(", ")}. docs/data is unchanged. Re-run — a cold cache pulls every district.`);
                process.exit(1);
              }
            }
          '

      # Snapshot the last build's per-district counts before the rebuild wipes
      # them, so the collapse guard below can compare against known-good numbers.
      - name: Snapshot previous coverage
        run: cp docs/data/stats.json /tmp/prev-stats.json 2>/dev/null || echo '{"districts":[]}' > /tmp/prev-stats.json

      - name: Build site data
        run: node scripts/3-build-site-data.mjs

      # A district that collapsed to a fraction of last build's electors is a
      # Drive-throttling download failure, not real data — refuse rather than
      # overwrite good data with a truncated district (Bagalkot 0, Mandya 17k).
      # allow_partial=true bypasses it for a deliberate partial publish.
      - name: Guard against a collapsed district
        if: ${{ inputs.allow_partial != true }}
        run: PREV_STATS=/tmp/prev-stats.json node scripts/guard-district-coverage.mjs

      # Before trusting the checks below, check the checks. Both of these have
      # blocked a correct import: the coverage guard is what a lost district
      # trips, and verify-build failed two entirely correct statewide runs
      # because it compared rows against a document they did not come from.
      - name: Test the guards
        run: |
          node scripts/test-coverage-guard.mjs
          node scripts/test-collapse-guard.mjs
          node scripts/test-verify-build.mjs


      # 100% verification, using both halves already on this runner: every
      # extracted row must be present and correct in the built buckets. Doing
      # this against the live site instead would need ~65,000 bucket requests
      # and ~52,000 PDFs, which Pages rate-limits, and would test the CDN rather
      # than the pipeline. Non-zero exit here means nothing gets published.
      - name: Verify the build against every source row
        run: node --max-old-space-size=6144 scripts/verify-build.mjs

      - name: Sanity-check the lookup before publishing
        run: node scripts/smoke-test.mjs

      # The only check here that does not come from the booth PDFs. Everything
      # else compares the site to documents we found, so a document the crawl
      # never found is invisible to all of them -- which is exactly how
      # 92-Siruguppa went missing while verification reported zero problems.
      # Reporting, not blocking: district labels differ between the CEO's tables
      # and the Drive folders, so a clean run is not yet the expected state.
      - name: Reconcile against the CEO's official ASDDO totals
        continue-on-error: true
        run: node scripts/reconcile.mjs

      - name: Report size
        run: |
          echo "docs/data: $(du -sh docs/data | cut -f1) across $(find docs/data -type f | wc -l) files"
          BYTES=$(du -sb docs/data | cut -f1)
          if [ "$BYTES" -gt 900000000 ]; then
            echo "::warning::docs/data is over 900 MB; GitHub Pages caps a published site at 1 GB."
          fi

      - name: Commit the rebuilt data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Refresh the baseline the next run diffs against, so a booth that moved
          # (even if its parsed rows didn't change) is not re-pulled every run.
          gzip -9c cache/manifest.json > seed/manifest.json.gz
          git add docs/data seed/manifest.json.gz
          if git diff --cached --quiet; then
            echo "No change to publish."
            exit 0
          fi
          RECORDS=$(node -e 'console.log(require("./docs/data/manifest.json").counts.records)')
          DISTRICTS=$(node -e 'console.log(require("./docs/data/manifest.json").counts.districts)')
          git commit -m "Import ASDDO data: ${RECORDS} records across ${DISTRICTS} districts

          Discovered ${{ needs.discover.outputs.total }} booth PDFs. Streamed and
          parsed on the runner; no PDFs stored."
          # The 2-hourly seed sweep (and manual pushes) can land on main while this
          # import runs. Those commits only touch seed/, this one only docs/data, so
          # they never conflict — rebase the data commit onto whatever arrived and
          # retry rather than failing the whole build on a non-fast-forward.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep 3
          done
          echo "push still failing after 5 attempts"
          exit 1

      # Persist this run's rows so the next run reuses unchanged districts instead
      # of re-downloading them. Keyed per run_id with an "extracted-" restore
      # prefix so the next run restores the newest. Runs even on failure — the
      # pulled rows are still valid and worth keeping to avoid re-hitting Drive.
      - name: Save extracted-rows cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/extracted
          key: extracted-${{ github.run_id }}
